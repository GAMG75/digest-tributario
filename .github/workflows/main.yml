name: Digest Tributario Chile

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          cd digest-tributario
          pip install -r requirements.txt --break-system-packages || pip install -r requirements.txt

      - name: Instalar Chromium
        run: playwright install chromium --with-deps

      - name: Ejecutar Digest Tributario
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: |
          cd digest-tributario
          python main.py

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: digest-tributario/logs/
          retention-days: 14
